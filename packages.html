<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packages</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Packages</h1>
    <table id="packagesTable">
        <thead>
            <tr>
                <th>Package Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <h2>Add/Edit Package</h2>
    <input type="text" id="packageName" placeholder="Package Name" required />
    <input type="text" id="packageDescription" placeholder="Description" required />
    <button id="addButton">Add Package</button>

    <script>
        const packages = JSON.parse(localStorage.getItem('packages')) || [];
        const packagesTable = document.getElementById('packagesTable').getElementsByTagName('tbody')[0];
        const packageNameInput = document.getElementById('packageName');
        const packageDescriptionInput = document.getElementById('packageDescription');
        const addButton = document.getElementById('addButton');

        function refreshTable() {
            packagesTable.innerHTML = '';
            packages.forEach((pkg, index) => {
                const row = packagesTable.insertRow();
                row.insertCell(0).innerHTML = pkg.name;
                row.insertCell(1).innerHTML = pkg.description;
                const actionsCell = row.insertCell(2);
                actionsCell.innerHTML = `<button onclick="editPackage(${index})">Edit</button>`;
            });
        }

        function editPackage(index) {
            packageNameInput.value = packages[index].name;
            packageDescriptionInput.value = packages[index].description;
            addButton.onclick = () => updatePackage(index);
        }

        function updatePackage(index) {
            packages[index] = {
                name: packageNameInput.value,
                description: packageDescriptionInput.value
            };
            localStorage.setItem('packages', JSON.stringify(packages));
            refreshTable();
            clearInputs();
            addButton.onclick = addPackage;
        }

        function addPackage() {
            const newPackage = {
                name: packageNameInput.value,
                description: packageDescriptionInput.value
            };
            packages.push(newPackage);
            localStorage.setItem('packages', JSON.stringify(packages));
            refreshTable();
            clearInputs();
        }

        function clearInputs() {
            packageNameInput.value = '';
            packageDescriptionInput.value = '';
        }

        document.addEventListener('DOMContentLoaded', refreshTable);
        addButton.onclick = addPackage;
    </script>
</body>
</html>
